<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>File Preview — 应用图标方案（待确认）</title>
<style>
  :root {
    --ink: #1b2434;
    --muted: #5f6b7a;
    --bg: #f3f5f8;
    --panel: #fff;
    --line: #c9d1db;
    --accent: #0f6cbd;
  }
  html[data-theme="dark"] {
    --ink: #e8ecf2;
    --muted: #9ba6b5;
    --bg: #1b1f27;
    --panel: #252a32;
    --line: #3a4452;
    --accent: #60a5fa;
  }
  body {
    margin: 0;
    padding: 24px;
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #8a93a3;
    color: #e8ecf2;
  }
  h1 { font-size: 16px; margin: 0 0 6px; color: #fff; }
  p.lead { margin: 0 0 20px; color: #d0d5dd; max-width: 720px; }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  .card {
    width: 200px;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .card h2 { font-size: 13px; margin: 0 0 4px; }
  .card p { margin: 0 0 12px; font-size: 11px; color: var(--muted); }
  .tile {
    width: 96px;
    height: 96px;
    margin: 0 auto 12px;
    border-radius: 22px;
    display: grid;
    place-items: center;
    box-shadow: 0 4px 12px rgb(0 0 0 / 15%);
  }
  .tile svg { width: 56px; height: 56px; }
  .bar { margin-top: 20px; }
  button {
    height: 28px;
    padding: 0 12px;
    border-radius: 6px;
    border: 1px solid #5a6472;
    background: #2c3340;
    color: #eee;
    cursor: pointer;
    font: inherit;
  }
  button.on { background: #0f6cbd; border-color: #0f6cbd; }
  .row {
    display: flex;
    gap: 20px;
    align-items: center;
    margin-top: 24px;
    padding: 16px;
    background: #1e2430;
    border-radius: 10px;
  }
  .row span { font-size: 12px; color: #c5cad3; }
  .mini { width: 32px; height: 32px; border-radius: 7px; }
  .mini svg { width: 20px; height: 20px; }
</style>
</head>
<body>
  <h1>应用图标 — 四个方案（未替换现有 ico）</h1>
  <p class="lead">
    风格对齐方案 B：冷灰底 + Win 蓝强调、圆角方砖、线性文档符号。
    确认编号后我再生成 ICO 并替换安装包图标。
  </p>

  <div class="grid">
    <div class="card">
      <h2>方案 1 · 文档眼</h2>
      <p>白纸 + 预览高光，最像「文件预览」</p>
      <div class="tile" style="background:#0f6cbd">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="16" y="10" width="32" height="44" rx="4" fill="#fff"/>
          <path d="M24 22h16M24 30h16M24 38h10" stroke="#0f6cbd" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="44" cy="46" r="12" fill="#0f6cbd" stroke="#fff" stroke-width="3"/>
          <circle cx="44" cy="46" r="4" fill="#fff"/>
        </svg>
      </div>
    </div>

    <div class="card">
      <h2>方案 2 · 折页窗</h2>
      <p>更抽象的窗口 + 翻页，适合任务栏</p>
      <div class="tile" style="background:linear-gradient(160deg,#1a5a9e,#0f6cbd)">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="12" y="14" width="40" height="36" rx="6" fill="#fff" fill-opacity=".95"/>
          <path d="M12 22h40" stroke="#0f6cbd" stroke-width="2"/>
          <circle cx="18" cy="18" r="2" fill="#0f6cbd"/>
          <circle cx="24" cy="18" r="2" fill="#8bb8e8"/>
          <path d="M22 28h12l6 6v10H22V28z" fill="#dce2ea" stroke="#0f6cbd" stroke-width="1.5"/>
          <path d="M34 28v6h6" stroke="#0f6cbd" stroke-width="1.5" fill="none"/>
        </svg>
      </div>
    </div>

    <div class="card">
      <h2>方案 3 · 静音深蓝</h2>
      <p>深底浅字，更系统、更安静</p>
      <div class="tile" style="background:#1b2434">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="18" y="12" width="28" height="40" rx="3" fill="#f3f5f8"/>
          <path d="M24 22h16M24 30h16M24 38h12" stroke="#5f6b7a" stroke-width="2" stroke-linecap="round"/>
          <path d="M40 40l10 10" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
          <circle cx="38" cy="38" r="6" stroke="#60a5fa" stroke-width="3" fill="#1b2434"/>
        </svg>
      </div>
    </div>

    <div class="card">
      <h2>方案 4 · 双页</h2>
      <p>多文件/双栏，强调批量预览</p>
      <div class="tile" style="background:#0f6cbd">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="10" y="16" width="22" height="32" rx="3" fill="#fff" fill-opacity=".35"/>
          <rect x="28" y="12" width="26" height="36" rx="3" fill="#fff"/>
          <path d="M34 22h14M34 30h14M34 38h9" stroke="#0f6cbd" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="row">
    <span>任务栏小尺寸（32px）预览：</span>
    <div class="tile mini" style="background:#0f6cbd;margin:0">
      <svg viewBox="0 0 64 64" fill="none"><rect x="16" y="10" width="32" height="44" rx="4" fill="#fff"/><circle cx="44" cy="46" r="12" fill="#0f6cbd" stroke="#fff" stroke-width="3"/><circle cx="44" cy="46" r="4" fill="#fff"/></svg>
    </div>
    <div class="tile mini" style="background:linear-gradient(160deg,#1a5a9e,#0f6cbd);margin:0">
      <svg viewBox="0 0 64 64" fill="none"><rect x="12" y="14" width="40" height="36" rx="6" fill="#fff"/><path d="M22 28h12l6 6v10H22z" fill="#dce2ea" stroke="#0f6cbd"/></svg>
    </div>
    <div class="tile mini" style="background:#1b2434;margin:0">
      <svg viewBox="0 0 64 64" fill="none"><rect x="18" y="12" width="28" height="40" rx="3" fill="#f3f5f8"/><circle cx="38" cy="38" r="6" stroke="#60a5fa" stroke-width="3" fill="#1b2434"/></svg>
    </div>
    <div class="tile mini" style="background:#0f6cbd;margin:0">
      <svg viewBox="0 0 64 64" fill="none"><rect x="28" y="12" width="26" height="36" rx="3" fill="#fff"/><path d="M34 22h14M34 30h14" stroke="#0f6cbd" stroke-width="2"/></svg>
    </div>
  </div>

  <div class="bar">
    <button type="button" id="t">切换黑夜底</button>
  </div>
<script>
  document.getElementById('t').onclick = () => {
    const d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark';
  };
</script>
</body>
</html>
